server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location = /support {
        return 308 /legal/support.html;
    }

    location = /delete-account {
        return 308 /legal/delete-account.html;
    }

    location = /privacy {
        return 308 /legal/privacy.html;
    }

    # CanvasKit kendi sürümünü yolunda taşır; içeriği Flutter sürümüne bağlı,
    # build'den build'e değişmez — uzun cache güvenli.
    location ^~ /canvaskit/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Flutter'ın giriş dosyaları ve asset manifesti her build'de AYNI isimle
    # yeniden üretilir. Uzun cache verilirse tarayıcı yeni deploy'u hiç görmez;
    # no-cache ile içerik saklanır ama her açılışta ETag ile doğrulanır (304).
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location ~* ^/(?:main\.dart\.js|flutter_bootstrap\.js|flutter_service_worker\.js|flutter\.js|version\.json|manifest\.json) {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # İsmi de içeriği de sabit kalan varlıklar (ikonlar, favicon, fontlar).
    location ~* \.(?:css|png|jpg|jpeg|gif|svg|ico|webp|woff2?|ttf|otf|wasm)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}
